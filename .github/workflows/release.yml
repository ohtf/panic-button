# The release pipeline, called by auto-tag.yml when a version bump lands on
# main (or run by hand with a tag to retry). cargo-dist builds the
# command-line programs; Tauri builds the desktop installers. One GitHub
# release carries everything, with SHA256SUMS. Then the Homebrew formulae
# and cask, and the AUR package, are updated. Adapted from koloki-co/dsc:
# the matrix is static and actions are pinned, so workflow data never
# becomes shell code.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish.
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: false
      AUR_SSH_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v0.1.0.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_DIST_VERSION: "0.34.0"

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Verify release plan
        shell: bash
        run: dist plan --tag "$RELEASE_TAG" --output-format=json

  build-local-artifacts:
    name: Build ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        # Pinned macOS runner labels (not `macos-latest`) so a GitHub-side
        # default bump can't silently change the OS a release artifact is
        # built on. GitHub retires each macOS runner image roughly a year
        # after its successor ships; check
        # https://github.com/actions/runner-images/issues for the next
        # retirement notice and bump these every 6-12 months regardless.
        # macos-14 -> macos-15: retiring 2026-11-02 (bumped 2026-10-16).
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DIST_TARGET: ${{ matrix.target }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Install cargo-dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm "https://github.com/axodotdev/cargo-dist/releases/download/v$env:CARGO_DIST_VERSION/cargo-dist-installer.ps1" | iex
      - name: Build local artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$DIST_TARGET" in
            aarch64-apple-darwin|aarch64-unknown-linux-gnu|x86_64-apple-darwin|x86_64-unknown-linux-gnu) ;;
            *) echo "Unexpected target: $DIST_TARGET" >&2; exit 1 ;;
          esac
          dist build --tag "$RELEASE_TAG" --artifacts=local --target="$DIST_TARGET" --output-format=json > dist-manifest.json
          cp dist-manifest.json "target/distrib/${DIST_TARGET}-dist-manifest.json"
      - name: Build local artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:DIST_TARGET -ne 'x86_64-pc-windows-msvc') {
            throw "Unexpected target: $env:DIST_TARGET"
          }
          dist build --tag "$env:RELEASE_TAG" --artifacts=local --target="$env:DIST_TARGET" --output-format=json > dist-manifest.json
          Copy-Item dist-manifest.json "target/distrib/$env:DIST_TARGET-dist-manifest.json"
      - name: Upload local artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: target/distrib/**

  build-global-artifacts:
    name: Build global artifacts
    needs: build-local-artifacts
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      - name: Build global artifacts
        shell: bash
        run: |
          dist build --tag "$RELEASE_TAG" --artifacts=global --output-format=json > dist-manifest.json
          cp dist-manifest.json target/distrib/global-dist-manifest.json
      - name: Upload global artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: target/distrib/**

  host:
    name: Create GitHub release
    needs: [build-global-artifacts, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Fetch build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        name: Host artifacts
        shell: bash
        run: |
          dist host --tag "$RELEASE_TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c '.' dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
        shell: bash
        run: |
          rm -f artifacts/*-dist-manifest.json
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          # `dist build --artifacts=local` leaves an unpacked staging directory
          # (panic-button-<target>/) in target/distrib, which the `path: target/distrib/**`
          # upload sweeps into artifacts/. `gh release create` rejects a directory
          # asset ("is a directory"), so upload only the regular files.
          (cd artifacts && find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'sha256.sum' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS)
          mapfile -t assets < <(find artifacts -maxdepth 1 -type f)
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" "${assets[@]}"

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-2022
          - name: linux
            # The oldest supported Ubuntu, so the AppImage runs on newer systems.
            runner: ubuntu-22.04
          - name: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install WebKitGTK, audio and AppImage tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libfuse2 file
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - name: Add macOS targets for a universal build
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install frontend packages
        working-directory: apps/desktop
        run: npm ci
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: npx tauri build --bundles msi
      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,rpm,appimage
      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: npx tauri build --target universal-apple-darwin --bundles dmg
      - name: Stage with stable names
        shell: bash
        run: |
          set -euo pipefail
          v="${RELEASE_TAG#v}"
          mkdir -p out
          b=target/release/bundle
          case "$RUNNER_OS" in
            Windows) cp "$b"/msi/*.msi "out/panic-button-desktop_${v}_x64_en-US.msi" ;;
            Linux)
              cp "$b"/deb/*.deb "out/panic-button-desktop_${v}_amd64.deb"
              cp "$b"/rpm/*.rpm "out/panic-button-desktop-${v}-1.x86_64.rpm"
              cp "$b"/appimage/*.AppImage "out/panic-button-desktop_${v}_amd64.AppImage"
              ;;
            macOS) cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/panic-button-desktop_${v}_universal.dmg" ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish-homebrew:
    name: Publish Homebrew formulae and cask
    needs: host
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HAVE_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAVE_KEY == 'true'
        with:
          repository: ohtf/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
          persist-credentials: true
      - name: Fetch formulae
        if: env.HAVE_KEY == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-global
          path: global
      - name: Fetch the macOS disk image
        if: env.HAVE_KEY == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-desktop-macos
          path: dmg
      - name: Commit formulae and cask
        if: env.HAVE_KEY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          v="${RELEASE_TAG#v}"
          mkdir -p tap/Formula tap/Casks
          cp global/panic-button-cli.rb tap/Formula/
          # Until 0.2.0 the agent and relay had formulae of their own; they
          # are now in panic-button-cli.
          (cd tap && git rm -q --ignore-unmatch Formula/panic-button-agent.rb Formula/panic-button-relay.rb)
          sha="$(sha256sum "dmg/panic-button-desktop_${v}_universal.dmg" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/${v}/" -e "s/@SHA256@/${sha}/" src/packaging/homebrew/panic-button.rb.in \
            | grep -v '^#' > tap/Casks/panic-button.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/panic-button-cli.rb Casks/panic-button.rb
          git commit -m "panic-button $RELEASE_TAG"
          git push
      - name: No tap key
        if: env.HAVE_KEY != 'true'
        run: echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; the tap was not updated."

  publish-aur:
    name: Publish AUR package
    needs: host
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HAVE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Fetch the Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-desktop-linux
          path: linux
      - name: Render PKGBUILD and .SRCINFO
        shell: bash
        run: |
          set -euo pipefail
          v="${RELEASE_TAG#v}"
          deb="$(sha256sum "linux/panic-button-desktop_${v}_amd64.deb" | cut -d' ' -f1)"
          exc="$(sha256sum LICENSE-EXCEPTIONS.md | cut -d' ' -f1)"
          mkdir aur
          cp packaging/aur/panic-button.install aur/
          sed -e "s/@VERSION@/${v}/" -e "s/@DEB_SHA256@/${deb}/" -e "s/@EXCEPTION_SHA256@/${exc}/" \
            packaging/aur/PKGBUILD.in > aur/PKGBUILD
          docker run --rm -v "$PWD/aur:/pkg" -w /pkg \
            archlinux:base@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899 \
            bash -c 'useradd -m b && chown -R b /pkg && su b -c "makepkg --printsrcinfo > .SRCINFO"'
          cat aur/.SRCINFO
      - name: Push to the AUR
        if: env.HAVE_KEY == 'true'
        shell: bash
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/panic-button-bin.git aurrepo
          cp aur/PKGBUILD aur/.SRCINFO aur/panic-button.install aurrepo/
          cd aurrepo
          git config user.name "Open Health Technology Foundation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO panic-button.install
          git diff --cached --quiet || git commit -m "Update to ${RELEASE_TAG#v}"
          git push origin HEAD:master
      - name: No AUR key
        if: env.HAVE_KEY != 'true'
        run: echo "::warning::AUR_SSH_PRIVATE_KEY is not set; the AUR package was not updated."
